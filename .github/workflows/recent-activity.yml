name: Update README with recent activity

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recent-activity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Readme-Workflows/recent-activity@main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
